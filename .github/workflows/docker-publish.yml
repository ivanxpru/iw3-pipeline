name: Build and Push iw3-pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Образ тяжёлый: torch cu126 (~3 ГБ) + ZoeD_Any_N (~1.34 ГБ) +
    # DA3MONO-LARGE (~1.34 ГБ) + hub-форки. Кэш слоёв обязателен.
    # HF_TOKEN: gated-веса Depth Pro (apple/DepthPro-checkpoints, лицензия Apple ML).
    # Секрет HF_TOKEN (если задан) — веса запекаются в образ; если нет — образ
    # собирается без них, докачка на инстансе: scripts/download-depthpro.sh.
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        secrets: |
          HF_TOKEN=${{ secrets.HF_TOKEN }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/iw3-pipeline:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/iw3-pipeline:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
